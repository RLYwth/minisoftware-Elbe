plugins {
    id 'com.android.application'
}

android {
    namespace 'de.wbsedu.elbe.cloak'
    compileSdk 36

    defaultConfig {
        applicationId 'de.wbsedu.elbe.cloak'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    def generatedWebAssets = layout.buildDirectory.dir('generated/webAssets').get().asFile
    sourceSets {
        main {
            assets.srcDir(generatedWebAssets)
        }
    }

    tasks.register('syncWebAssets', Copy) {
        from(rootProject.projectDir.parentFile) {
            include 'index.html'
            include 'manifest.webmanifest'
            include 'service-worker.js'
            include 'icons/**'
        }
        into(generatedWebAssets)
    }

    tasks.named('preBuild').configure {
        dependsOn('syncWebAssets')
    }
}
